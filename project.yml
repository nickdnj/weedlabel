name: weedlabel
options:
  bundleIdPrefix: com.demarconet
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: HighNotes
    INFOPLIST_KEY_NSCameraUsageDescription: "HighNotes uses your camera to read cannabis labels. Everything stays on your phone — nothing is uploaded."
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    DEVELOPMENT_TEAM: "5VPR237YHV"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  weedlabel:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: weedlabel
#        excludes:
#          - "Assets.xcassets"
      - path: assets/validation
        buildPhase: resources
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.demarconet.weedlabel
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

  weedlabelTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: weedlabelTests
    dependencies:
      - target: weedlabel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.demarconet.weedlabelTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/weedlabel.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/weedlabel"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  weedlabel:
    build:
      targets:
        weedlabel: all
        weedlabelTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - weedlabelTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
