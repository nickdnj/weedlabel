name: weedlabel
options:
  bundleIdPrefix: com.demarconet
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true

# Beta is release-optimised but compiles in the #if BETA tester-feedback code.
# TestFlight archives use Beta; the App Store archive uses Release (no BETA) so
# the shipping binary collects nothing — see docs/SPEC-beta-feedback.md.
configs:
  Debug: debug
  Release: release
  Beta: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Pocketbud
    INFOPLIST_KEY_NSCameraUsageDescription: "Pocketbud uses your camera to read cannabis labels. Everything stays on your phone — nothing is uploaded."
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    DEVELOPMENT_TEAM: "5VPR237YHV"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Standard OS encryption only → skip the export-compliance prompt on every upload.
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    # App version + build. Bump CURRENT_PROJECT_VERSION for each new TestFlight upload.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "3"

targets:
  weedlabel:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: weedlabel
#        excludes:
#          - "Assets.xcassets"
      - path: assets/validation
        buildPhase: resources
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.demarconet.weedlabel
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
      configs:
        # DEBUG inherited from the debug config type. BETA = tester feedback feature.
        # TIPJAR = the StoreKit tip jar (Debug-only for now: not in TestFlight or the
        # App Store build until the Paid Apps agreement + IAPs are set up).
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) BETA TIPJAR"
        Beta:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) BETA"
        # Release: no BETA, no TIPJAR — feedback feature and tip jar both compile out.

  weedlabelTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: weedlabelTests
    dependencies:
      - target: weedlabel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.demarconet.weedlabelTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/weedlabel.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/weedlabel"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  weedlabel:
    build:
      targets:
        weedlabel: all
        weedlabelTests: [test]
    run:
      config: Debug
      storeKitConfiguration: TipJar.storekit
    test:
      config: Debug
      targets:
        - weedlabelTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # TestFlight scheme: archives the Beta config so #if BETA feedback is included.
  # Use this for TestFlight uploads; use the `weedlabel` scheme (Release) for the
  # final App Store submission.
  weedlabel-Beta:
    build:
      targets:
        weedlabel: all
    run:
      config: Debug
      storeKitConfiguration: TipJar.storekit
    archive:
      config: Beta
