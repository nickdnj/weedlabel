<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Pocketbud app icon — white shirt + green pocket-protector with an unlit joint. Contents concealed (no leaf). -->
  <!-- App Store master: render this to a 1024x1024 PNG with NO alpha/transparency. -->
  <defs>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBF8F1"/><stop offset="1" stop-color="#EAE3D3"/></linearGradient>
    <linearGradient id="pkt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F0EADC"/><stop offset="1" stop-color="#DED5C0"/></linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#249A63"/><stop offset="1" stop-color="#15623E"/></linearGradient>
  </defs>

  <!-- white shirt + placket + buttons -->
  <rect width="1024" height="1024" fill="url(#shirt)"/>
  <rect x="118" y="0" width="34" height="1024" fill="#D9D1BF" opacity=".7"/>
  <line x1="123" y1="0" x2="123" y2="1024" stroke="#C7BCA4" stroke-width="3" opacity=".6"/>
  <circle cx="135" cy="250" r="14" fill="#CFC6B0"/>
  <circle cx="135" cy="660" r="14" fill="#CFC6B0"/>

  <!-- unlit joint (base concealed by the pocket front). No ember, no smoke. -->
  <g transform="rotate(18 540 470)">
    <path d="M516 648 L526 338 Q540 300 554 338 L564 648 Z" fill="#F6F1E7" stroke="#CFC5B0" stroke-width="6"/>
    <line x1="540" y1="372" x2="540" y2="610" stroke="#D8D0BD" stroke-width="3" opacity=".7"/>
  </g>

  <!-- pocket shadow + cream pocket front + stitch -->
  <path d="M286 588 q0 -28 28 -28 l396 0 q28 0 28 28 l0 200 -50 60 -352 0 -50 -60 Z" fill="#000" opacity=".07" transform="translate(0 14)"/>
  <path d="M286 576 q0 -28 28 -28 l396 0 q28 0 28 28 l0 200 -50 60 -352 0 -50 -60 Z" fill="url(#pkt)" stroke="#C9BEA4" stroke-width="4"/>
  <path d="M306 576 l412 0" stroke="#C2B79C" stroke-width="5" opacity=".8"/>

  <!-- green pocket-protector flap with scalloped hem + slots -->
  <path d="M320 542 l384 0 0 70 q-32 22 -64 0 q-32 -22 -64 0 q-32 22 -64 0 q-32 -22 -64 0 q-32 22 -64 0 q-32 -22 -64 0 Z" fill="url(#flap)"/>
  <rect x="426" y="560" width="7" height="48" rx="3.5" fill="#0F4F31" opacity=".5"/>
  <rect x="512" y="556" width="7" height="52" rx="3.5" fill="#0F4F31" opacity=".5"/>
  <rect x="598" y="560" width="7" height="48" rx="3.5" fill="#0F4F31" opacity=".5"/>
</svg>
